name: Build APT Repo from Releases

on:
  push:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-apt-repo
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurer Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Compiler la documentation VitePress
        run: |
          if [ -f docs/package-lock.json ]; then
            npm --prefix docs ci
          else
            npm --prefix docs install
          fi
          npm --prefix docs run docs:build

      - name: Installer les outils APT
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev apt-utils

      - name: Préparer le dossier temporaire
        run: mkdir -p apt-workspace

      - name: Récupérer le .deb depuis la Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -z "$RELEASE_TAG" ]; then
            gh release download --pattern "*.deb" --dir apt-workspace || echo "Aucun paquet .deb trouvé"
          else
            if [[ ! "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
              echo "Tag de release invalide : $RELEASE_TAG" >&2
              exit 1
            fi
            gh release download "$RELEASE_TAG" --pattern "*.deb" --dir apt-workspace
          fi

      - name: Ajouter la clé publique et le site web
        run: |
          cp public.key apt-workspace/
          cp -r website/* apt-workspace/

      - name: Importer la clé de sécurité
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Générer l'arborescence APT
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
        run: |
          cd apt-workspace
          dpkg-scanpackages --multiversion . > Packages
          gzip -k -f Packages
          apt-ftparchive release . > Release

          gpg --default-key "$GPG_FINGERPRINT" -abs -o Release.gpg Release
          gpg --default-key "$GPG_FINGERPRINT" --clearsign -o InRelease Release

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Préparer l'envoi web
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: './apt-workspace'

      - name: Mettre en ligne le dépôt
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
