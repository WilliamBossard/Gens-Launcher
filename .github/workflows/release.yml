name: "Build and Release Gens Launcher (Tauri v2)"

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-gens-launcher-rust
  cancel-in-progress: false

jobs:
  publish-tauri:
    name: Build & Publish on ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}

    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Linux Tauri dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Run Clippy (Zero Warnings)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Rust Tests
        working-directory: src-tauri
        run: cargo test

      - name: Build and Release with Tauri Action
        id: tauri_build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tagName: v__VERSION__
          releaseName: "Gens Launcher v__VERSION__"
          releaseBody: "Gens Launcher (Rust + Tauri v2) — Compatible mise à jour automatique depuis Electron."
          releaseDraft: true
          prerelease: false

      - name: Generate & Upload latest.yml (Windows NSIS for Electron -> Rust & Rust -> Rust)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $tag = "v$version"
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found" }
          $bytes = [System.IO.File]::ReadAllBytes($installer.FullName)
          $sha512 = [Convert]::ToBase64String([System.Security.Cryptography.SHA512]::Create().ComputeHash($bytes))
          $size = $installer.Length
          $date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ss.fffZ")
          $yml = @"
          version: $version
          files:
            - url: $($installer.Name)
              sha512: $sha512
              size: $size
          path: $($installer.Name)
          sha512: $sha512
          releaseDate: '$date'
          "@
          Set-Content -Path "latest.yml" -Value $yml -Encoding UTF8
          gh release upload $tag latest.yml --clobber

      - name: Generate & Upload latest-linux.yml (Linux AppImage)
        if: matrix.platform == 'ubuntu-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          TAG="v${VERSION}"
          APPIMG=$(ls src-tauri/target/release/bundle/appimage/*.AppImage | head -n 1)
          NAME=$(basename "$APPIMG")
          SHA512=$(openssl dgst -sha512 -binary "$APPIMG" | base64 -w 0)
          SIZE=$(stat -c%s "$APPIMG")
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
          cat <<EOF > latest-linux.yml
          version: ${VERSION}
          files:
            - url: ${NAME}
              sha512: ${SHA512}
              size: ${SIZE}
          path: ${NAME}
          sha512: ${SHA512}
          releaseDate: '${DATE}'
          EOF
          gh release upload "$TAG" latest-linux.yml --clobber

      - name: Generate & Upload latest-mac.yml (macOS DMG)
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          TAG="v${VERSION}"
          DMG=$(ls src-tauri/target/release/bundle/dmg/*.dmg | head -n 1)
          NAME=$(basename "$DMG")
          SHA512=$(openssl dgst -sha512 -binary "$DMG" | base64 | tr -d '\n')
          SIZE=$(stat -f%z "$DMG")
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
          cat <<EOF > latest-mac.yml
          version: ${VERSION}
          files:
            - url: ${NAME}
              sha512: ${SHA512}
              size: ${SIZE}
          path: ${NAME}
          sha512: ${SHA512}
          releaseDate: '${DATE}'
          EOF
          gh release upload "$TAG" latest-mac.yml --clobber
