[package]
name = "gens-launcher"
version = "1.9.4"
description = "Gens Launcher — Minecraft Launcher (Rust + Tauri v2)"
authors = ["William Bossard"]
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "net", "time", "sync"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream", "form"] }
futures-util = "0.3"
url = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }
flate2 = "1"
aes-gcm = "0.11"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
hmac = "0.13"
sha2 = "0.11"
sha1 = "0.11"
rand = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
